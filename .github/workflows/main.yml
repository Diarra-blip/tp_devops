name: CI devops 2025
on:
  # lance le pipeline sur main et develop
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # récupère le code du repo (historique complet, requis par Sonar)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # installe le JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # compile et lance les tests (unitaires + intégration)
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml

      # analyse de qualité de code avec SonarCloud (quality gate)
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.projectKey=Diarra-blip_tp_devops
          -Dsonar.organization=diarra-blip
          -Dsonar.host.url=https://sonarcloud.io
          --file ./simple-api/pom.xml

  # construit et publie les images Docker
  build-and-push-docker-image:
    # ne s'exécute que si les tests passent
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # connexion à Docker Hub avec les secrets
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          # build sur toutes les branches, push seulement sur main
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./httpd
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}
