name: CI devops 2025
on:
  # tests sur develop et main
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # récupère le code (historique complet, requis par Sonar)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # installe le JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # compile et lance les tests (unitaires + intégration)
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml

      # analyse de qualité de code avec SonarCloud (quality gate)
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=Diarra-blip_tp_devops
          -Dsonar.organization=diarra-blip
          -Dsonar.host.url=https://sonarcloud.io
          --file ./simple-api/pom.xml
